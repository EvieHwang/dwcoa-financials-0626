[project]
name = "dwcoa-financials"
version = "0.1.0"
description = "DWCOA Financials — FastAPI backend (auth, persistence, API, single-app deploy)."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "PyJWT>=2.8",
    "bcrypt>=4.1",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
# Feature test suites live with the feature artifacts, not next to the code.
# Each feature dir has its own conftest.py and its test files do a bare
# `from conftest import ...`; two same-named `conftest` modules cannot coexist
# in one Python process. So the canonical backend command runs one feature dir
# per pytest process (see constitution.md § Testing) — a bare `pytest` over the
# combined testpaths below WILL collide and is not the blessed invocation. The
# list documents the full cumulative suite; pass an explicit dir to run one.
testpaths = [
    "../features/foundation-001/tests/backend",
    "../features/legacy-migration-002/tests/backend",
    "../features/ingestion-003/tests/backend",
]
