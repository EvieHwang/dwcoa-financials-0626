name: Deploy to Fly

on:
  push:
    branches: [main]

# Only one deploy at a time; a newer push supersedes an in-flight one.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build, deploy, and health-gate
    runs-on: ubuntu-latest
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      FLY_APP: dwcoa-financials
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up flyctl
        uses: superfly/fly-actions/setup@master

      - name: Deploy image to Fly
        run: flyctl deploy --remote-only

      - name: Post-deploy health check (gates the job)
        # A zero exit from `flyctl deploy` means the release was created, not
        # that the app is reachable. Poll the live /api/health endpoint and
        # fail the job if it does not return 2xx within the retry window.
        run: |
          set -euo pipefail
          URL="https://${FLY_APP}.fly.dev/api/health"
          echo "Probing ${URL}"
          for attempt in $(seq 1 30); do
            code="$(curl -s -o /dev/null -w '%{http_code}' "${URL}" || echo 000)"
            echo "attempt ${attempt}: HTTP ${code}"
            if [ "${code}" -ge 200 ] && [ "${code}" -lt 300 ]; then
              echo "Health check passed."
              exit 0
            fi
            sleep 10
          done
          echo "Health check failed: /api/health did not return 2xx in time." >&2
          exit 1
